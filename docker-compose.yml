services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: miirag-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miirag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miirag}
      POSTGRES_DB: ${POSTGRES_DB:-miirag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miirag} -d ${POSTGRES_DB:-miirag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
